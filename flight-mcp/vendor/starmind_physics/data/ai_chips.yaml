# =============================================================================
# Starmind candidate AI-chip database
# =============================================================================
# Purpose: catalogue accelerators that *could* fly on a Starmind-class
# orbital compute vehicle (SpaceX: "chip vendor agnostic"; first gen reported
# as Nvidia Vera/Rubin-based — secondary press, Oct 2026 plan).
#
# Legend for every numeric radiation field:
#   [S] = sourced (URL in sources[])
#   [A] = modelling assumption for ranking — NOT a measured fact
#   [?] = unknown / no public number; placeholder only
#
# Never treat [A] or [?] dose limits as Nvidia/SpaceX flight specs.
# =============================================================================

schema_version: 1
updated: "2026-10-03"
notes: >
  Radiation hardness for almost all modern AI accelerators is unpublished.
  Only a few rows have sourced TID/SEU anchors. Commercial GPU/TPU rows that
  lack tests inherit the Google Trillium HBM-onset 2 krad(Si) commercial
  analogue [A] so the physics core can rank orbits — replace when real data
  exists. Space-grade rows use published rad-hard / rad-tolerant specs where
  cited; those parts are typically CPUs/FPGAs, not datacenter AI dies.

# Shared modelling defaults applied when a chip omits a field [A]
defaults:
  dose_limit_krad_Si_commercial_analogue: 2.0   # [A] from Trillium HBM onset [S]
  dose_limit_krad_Si_unknown_slider: 2.0        # [A] starting slider for [?] parts
  seu_R_ref_upsets_per_bit_day_commercial: 1.0e-10  # [A]
  seu_R_ref_upsets_per_bit_day_rad_hard: 1.0e-11    # [A] order of RAD750 class [S]
  t_recovery_s: 30.0                            # [A]

categories:
  - id: starmind_announced
    label: Announced / reported for Starmind
  - id: commercial_ai
    label: Commercial AI accelerators (future candidates)
  - id: space_rad_tolerant
    label: Space-grade / rad-tolerant compute (not datacenter AI dies)
  - id: edge_ai
    label: Edge / module AI (demo-scale candidates)
  - id: legacy_anchor
    label: Legacy radiation anchors used for presets

chips:
  # ---------------------------------------------------------------------------
  # Starmind-linked
  # ---------------------------------------------------------------------------
  - id: nvidia_vera_rubin_nvl72
    vendor: NVIDIA
    product: Vera Rubin NVL72 (optimized for Starmind)
    category: starmind_announced
    role: primary_compute
    starmind_status: reported_first_gen
    starmind_status_note: >
      Secondary press (MLQ, Startup Fortune, Wikipedia Starmind page) say
      first-gen Starmind is based on an optimized Vera Rubin NVL72. Not a
      primary SpaceX datasheet radiation claim.
    process_nm: null
    memory: HBM (rack-scale NVL72; capacity not used as a fact here)
    memory_bits: 8.0e11                    # [A] ~1 Tbit-class placeholder for SEU scaling
    tdp_w_per_gpu: null                    # [?] unpublished for the optimized variant
    rack_tdp_kw: null                      # [?]
    dose_limit_krad_Si: 2.0                # [?] unknown — slider default = commercial analogue [A]
    dose_limit_basis: unknown_use_commercial_analogue
    dose_limit_provenance: assumed
    seu_R_ref_upsets_per_bit_day: 1.0e-10  # [A]
    seu_provenance: assumed
    sources:
      - url: https://mlq.ai/news/spacex-targets-fourth-quarter-2027-launch-for-nvidia-based-starmind-ai-satellites/
        claim: "Starmind / Vera Rubin association (secondary)"
        tag: S
      - url: https://en.wikipedia.org/wiki/Starmind_(satellite)
        claim: "Starmind overview (secondary)"
        tag: S
    tags: [nvidia, rubin, nvl72, starmind, hbm]

  - id: nvidia_rubin_gpu_die
    vendor: NVIDIA
    product: Rubin GPU (single die / board-level placeholder)
    category: starmind_announced
    role: primary_compute
    starmind_status: implied_building_block
    starmind_status_note: >
      Placeholder for a single Rubin-class GPU if SpaceX flies a non-NVL72
      packing. Radiation tolerance unpublished [?].
    memory_bits: 1.6e11                   # [A]
    dose_limit_krad_Si: 2.0               # [?] → commercial analogue [A]
    dose_limit_basis: unknown_use_commercial_analogue
    dose_limit_provenance: assumed
    seu_R_ref_upsets_per_bit_day: 1.0e-10 # [A]
    seu_provenance: assumed
    sources: []
    tags: [nvidia, rubin, placeholder]

