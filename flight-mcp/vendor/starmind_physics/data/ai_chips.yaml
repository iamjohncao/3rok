    memory: HBM
    memory_bits: 8.0e10                   # [A] scale for SEU model
    dose_limit_krad_Si: 2.0               # [S] HBM irregularities onset
    dose_limit_hard_fail_krad_Si: 15.0    # [S] no TID hard fail on one chip up to this
    expected_mission_dose_krad_Si: 0.75   # [S] Google's shielded 5-year expectation example
    dose_limit_basis: trillium_hbm_onset_proton_beam
    dose_limit_provenance: sourced
    seu_R_ref_upsets_per_bit_day: 1.0e-10 # [A] rate not published as a CREME number
    seu_provenance: assumed
    sources:
